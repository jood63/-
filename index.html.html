<style>

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

const MSG={bored:'فهمت إنك طفشان، لا تشيل هم. جهّزت لك أفكار تغيّر جوّك.',stress:'أحس فيك، الضغط يعدّي. هذي أفكار هادية تريّحك وترجّع لك تركيزك.',focus:'تبي تركّز؟ هذي خطوات بسيطة تساعدك.',change:'تبي تغيّر جو؟ أبشر، هذي أفكار تنعش يومك.',out:'يلا نطلع! هذي اقتراحات تناسبك.',free:'وقتك فاضي؟ خلّنا نستفيد منه بشي يفرّحك.',calm:'تبي هدوء؟ هذي اقتراحات تريّح بالك.'};
const QK=['طفشان','أبي أطلع','عندي وقت فراغ','متوتر','أبي أغير جو','أحتاج تركيز'],EX=['طفشان بالبيت','عندي ساعتين فاضية','أبغى نشاط مع أهلي'];
const nz=t=>t.replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const esc=v=>v.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const fm=m=>m>=60?(m==60?'ساعة':m==120?'ساعتين':m/60+' ساعات'):m+' دقيقة';
function analyze(t){const x=nz(t),h=r=>r.test(x),o={tags:[]};let m;
 o.mood=h(/طفش|زهق|ملل|مليت|مضايق/)?'bored':h(/متوتر|توتر|قلق|ضغط|مضغوط|اختبار|امتحان|خايف|مرهق|تعبان/)?'stress':h(/تركيز|اركز|ذاكر|مذاكر|دراس/)?'focus':h(/اغير|تغيير|جو جديد|روتين/)?'change':h(/هاد|هدوء|رواق|استرخ|ارتاح/)?'calm':h(/اطلع|اخرج|خروج|برا|مشوار/)?'out':h(/فراغ|فاضي|وقت/)?'free':null;
 if(m=x.match(/(\d+)\s*(دقيق|دقايق)/))o.time=+m[1];else if(m=x.match(/(\d+)\s*ساع/))o.time=60*m[1];else if(/ساعتين/.test(x))o.time=120;else if(/نص ساع|نصف ساع/.test(x))o.time=30;else if(/ربع ساع/.test(x))o.time=15;else if(/ساعه/.test(x))o.time=60;
 o.social=h(/اهل|عايل|عائل|عيال|اولاد|امي|ابوي|اخوي|زوج|بنات|ولاد/)?'family':h(/صديق|ربع|اصحاب|شباب|صحب|خوي/)?'friends':h(/وحد|لحال|بروحي/)?'alone':null;
 o.place=h(/بيت|داخل|غرف|منزل/)?'indoor':h(/برا|اطلع|حديق|هوا|مفتوح|كورنيش|ممشي|بحر|اخرج/)?'outdoor':null;
 const q=h(/هاد|هدوء|رواق/);
 ({stress:['calm'],calm:['calm','quiet'],focus:['focus'],bored:['creative'],change:['outdoor'],out:['outdoor']}[o.mood]||[]).forEach(t=>o.tags.push(t));
 if(o.social)o.tags.push(o.social);if(o.place)o.tags.push(o.place);if(q)o.tags.push('quiet');return o}
function build(o,off){const tt=o.time||S.time;
 const L=ACTS.filter(a=>!S.dis.includes(a.id)).map(a=>{const g=TG[a.id]||'';let sc=0;o.tags.forEach(t=>{if(g.includes(t))sc+=3});
  if(o.social=='family'&&!g.includes('family'))sc-=3;if(o.place=='indoor'&&a.o)sc-=2;if(o.place=='outdoor'&&!a.o)sc-=1;
  sc+=a.m<=tt?2:-3;if(S.interests.includes(a.i))sc+=1.5;sc+=Math.min(1,S.hist.filter(x=>x.i==a.i).length*.3);return{a,sc:sc+(a.id%5)*.01}}).sort((x,y)=>y.sc-x.sc).map(x=>x.a);
 const st=L.length>off+3?off:0,top=L.slice(st,st+3),why={};
 top.forEach(a=>{const g=TG[a.id]||'',t=o.tags.find(t=>g.includes(t)&&TW[t]);why[a.id]=(t?TW[t]:'يناسب اهتماماتك')+(a.m<=tt?'، ويناسب وقتك':'')});
 let msg=MSG[o.mood]||'ما قدرت أحدد بالضبط، بس هذي أفكار تناسبك اليوم.';
 if(o.time)msg+=' حسبت لك على وقتك ('+fm(o.time)+').';if(o.social=='family')msg+=' وخليتها مع أهلك.';
 return{msg,ids:top.map(a=>a.id),why}}
function ask(t,keep){t=(t==null?($('#mi')||{}).value||'':t).trim();if(!t)return toast('اكتب شي بسيط أو اختر من الخيارات');
 if(!keep)S.off=0;S.q=t;const o=analyze(t);if(o.time)S.time=Math.min(o.time,120);S.mood={out:'out',change:'change',bored:'bored',free:'free'}[o.mood]||null;S.skip=0;pick();
 S.ir=build(o,S.off||0);S.ty=true;render();setTimeout(()=>{S.ty=false;rr()},500)}
function smart(){const r=S.ir;
return`<div class="card sm"><h2 style="margin:0 0 4px">كيف حالك اليوم؟</h2><p style="font-size:calc(14px*var(--ts,1))">اكتب بكلامك، أو اختر خيار سريع.</p>
<div class="smi"><textarea id="mi" rows="2" aria-label="كيف تشعر أو ماذا تبحث عنه" placeholder="اكتب كيف تشعر أو ماذا تبحث عنه..." onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();ask()}">${esc(S.q||'')}</textarea><button class="smb" aria-label="إرسال" onclick="ask()">${ic('send')}</button></div>
<div class="chs">${QK.map(x=>`<span class="chip ${S.q==x?'on':''}" onclick="ask('${x}')">${x}</span>`).join('')}</div>

${S.ty?'<div class="bub2"><span class="ty"><i></i><i></i><i></i></span></div>':r?`<div class="bub2 fade">${r.msg}</div>${r.ids.map(id=>{const a=ACTS.find(x=>x.id==id);return`<div class="rc fade"><h3>${a.t}</h3><p style="font-size:calc(14px*var(--ts,1))">${a.m} دقيقة · ${r.why[id]}</p><button class="btn sec sm" style="margin-top:16px" onclick="startA(${id},0,'smart')">ابدأ</button></div>`}).join('')}<button class="btn gh" style="margin-top:8px" onclick="S.off=(S.off||0)+3;ask(S.q,1)">اقتراحات ثانية</button>`:''}</div>`}
let F=null,FI=null,AC=null,SN=null;
const SO=[['none','بدون صوت'],['rain','مطر'],['nature','طبيعة'],['white','ضوضاء بيضاء']];
const FMS=[['ابدأنا بهدوء، خذ نفس عميق.','لا تستعجل، أنت في المكان الصح.'],['تركيزك ينمو خطوة خطوة.','كل دقيقة هنا هدية لنفسك.'],['أنت في منتصف الطريق، شغل ممتاز.','هدوءك يصنع فرق، كمّل بخفة.'],['قربنا، فخورين فيك.','لمسة أخيرة من الهدوء، أنت قدّها.']];
const fmsg=pc=>FMS[Math.min(3,Math.floor(pc*4))][Math.floor(F.el/45)%2];
function sndStop(){if(SN){const o=SN;SN=null;clearInterval(o.iv);try{o.g.gain.linearRampToValueAtTime(0,AC.currentTime+.6);setTimeout(()=>{try{o.src.stop()}catch(e){}},700)}catch(e){}}}
function snd(k){sndStop();if(!k||k=='none')return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;d[i]=k=='nature'?(l=(l+.02*w)/1.02)*3.5:w}
const src=AC.createBufferSource();src.buffer=b;src.loop=true;const g=AC.createGain(),f=AC.createBiquadFilter();g.gain.value=0;
if(k=='rain'){f.type='bandpass';f.frequency.value=2200;f.Q.value=.35}else if(k=='nature'){f.type='lowpass';f.frequency.value=700}else{f.type='lowpass';f.frequency.value=4500}
src.connect(f);f.connect(g);g.connect(AC.destination);src.start();g.gain.linearRampToValueAtTime(k=='white'?.06:.12,AC.currentTime+2);
let iv=null;if(k=='nature')iv=setInterval(()=>{if(Math.random()<.6||!AC||AC.state!='running')return;const t=AC.currentTime,fr=2000+Math.random()*900;[0,.18].forEach((o,j)=>{const os=AC.createOscillator(),gg=AC.createGain();os.frequency.value=fr+j*250;gg.gain.setValueAtTime(0,t+o);gg.gain.linearRampToValueAtTime(.025,t+o+.04);gg.gain.linearRampToValueAtTime(0,t+o+.2);os.connect(gg);gg.connect(AC.destination);os.start(t+o);os.stop(t+o+.25)})},3500);
SN={src,g,iv}}catch(e){}}
function ring(pc){const C=2*Math.PI*88;return`<div class="fr" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pc*100)}" aria-label="تقدّم جلسة التركيز"><svg viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFE4DA"/><stop offset="1" stop-color="#2E6F5E"/></linearGradient></defs><circle class="glow" cx="100" cy="100" r="96"/><g transform="rotate(-90 100 100)"><circle cx="100" cy="100" r="88" fill="none" style="stroke:var(--tint)" stroke-width="12"/><circle id="fp" cx="100" cy="100" r="88" fill="none" stroke="url(#fg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc)}"/></g><g id="fl" transform="translate(100 134) scale(${.55+.45*pc})"><path d="M-18 0h36l-5 14h-26z" fill="#D5CEBF"/><path d="M0 0V-40" stroke="#1B2E2A" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M0 -16C-22 -18 -26 -36 -24 -44 -6 -42 0 -30 0 -16z" fill="#2E6F5E"/><path d="M0 -26C22 -28 26 -46 24 -54 6 -52 0 -40 0 -26z" fill="#CFE4DA"/><circle cy="-42" r="6" fill="#CFE4DA"/></g></svg></div>`}
const fcard=()=>S.guest?'':`<button class="card qb fc" onclick="openF()"><span class="spk">${ic('leaf')}</span><span><b style="display:block;font-size:16px">جلسة تركيز هادئة</b><span class="mu">اختر وقتك وخلّ الهدوء يرافقك</span></span><span class="chev">${ic('chev')}</span></button>`;
function openF(){F={ph:'setup',dur:30,cu:false,snd:'none',el:0,run:false};go('fs')}
function exitF(){clearInterval(FI);sndStop();F=null;go('main')}
function startF(){if(F.dur<5)F.dur=5;F.ph='run';F.el=0;F.run=true;F.last=Date.now();clearInterval(FI);FI=setInterval(ftick,1000);snd(F.snd);render()}
function ftick(){if(!F||F.ph!='run')return;const n=Date.now();if(F.run)F.el+=(n-F.last)/1000;F.last=n;const T=F.dur*60,pc=Math.min(1,F.el/T);
const a=$('#fp');if(a)a.style.strokeDashoffset=2*Math.PI*88*(1-pc);const p=$('#fl');if(p)p.setAttribute('transform',`translate(100 134) scale(${.55+.45*pc})`);
const e=$('#fe');if(e)e.textContent=`مرّت ${Math.floor(F.el/60)} دقيقة · ${Math.round(pc*100)}% من رحلتك`;const m=$('#fm'),t=fmsg(pc);if(m&&m.textContent!=t)m.textContent=t;const r=$('.fr');if(r)r.setAttribute('aria-valuenow',Math.round(pc*100));
if(pc>=1)doneF()}
function pauseF(){ftick();F.run=!F.run;F.last=Date.now();try{F.run?AC&&AC.resume():AC&&AC.suspend()}catch(e){}render()}
function chS(k){F.snd=k;if(F.ph=='run'&&F.run)snd(k);render()}
function doneF(){clearInterval(FI);sndStop();F.el=F.dur*60;F.ph='done';F.full=true;finish('جلسة تركيز '+F.dur+' دقيقة','focus');render();cel()}
function endF(){ftick();clearInterval(FI);sndStop();F.ph='done';F.full=false;const m=Math.round(F.el/60);if(F.el>=300)finish('جلسة تركيز '+m+' دقيقة','focus');F.rec=F.el>=300;render()}
function fview(){if(!F)return'';
if(F.ph=='setup')return`<div class="scr fade"><button class="chip" onclick="exitF()">→ رجوع</button><h1 style="margin-top:10px">جلسة تركيز هادئة</h1><p>بدون عدّاد ضاغط، نتابع نموّ تركيزك بهدوء.</p>
<h2>كم وقتك؟</h2><div>${[15,30,45,60].map(m=>`<span class="chip ${!F.cu&&F.dur==m?'on':''}" onclick="F.cu=false;F.dur=${m};render()">${m} دقيقة</span>`).join('')}<span class="chip ${F.cu?'on':''}" onclick="F.cu=true;render()">مخصص</span></div>
${F.cu?`<input id="cd" type="number" min="5" max="180" inputmode="numeric" aria-label="عدد الدقائق" placeholder="عدد الدقائق (5 - 180)" value="${F.dur}" oninput="F.dur=Math.max(5,Math.min(180,+this.value||0))">`:''}
<h2>صوت هادي (اختياري)</h2><div>${SO.map(([k,l])=>`<span class="chip ${F.snd==k?'on':''}" onclick="F.snd='${k}';render()">${l}</span>`).join('')}</div><br><button class="btn" onclick="startF()">ابدأ جلستي</button></div>`;
const pc=Math.min(1,F.el/(F.dur*60));
if(F.ph=='done')return`<div class="scr fsw fade" style="text-align:center"><h1>${F.full?'أنجزت جلستك كاملة':F.rec?'جلسة جميلة':'لا بأس، وقتك لك'}</h1>${ring(F.full?1:pc)}<p>${F.full?'تركيزك نما اليوم، وهذا شي تفتخر فيه.':F.rec?'كل دقيقة تركيز تُحسب، وأنت تعتني بنفسك.':'ما فيه ضغط ولا حساب. جرّب مرة ثانية متى ما حبيت.'}</p><br><div class="row"><button class="btn" onclick="openF()">جلسة أخرى</button><button class="btn gh" onclick="exitF()">رجوع</button></div></div>`;
return`<div class="scr fsw fade" style="text-align:center"><div class="row sp"><button class="chip" style="margin:0" onclick="endF()">إنهاء بلطف</button><span class="tag d" style="flex:none">${F.dur} دقيقة</span></div>${ring(pc)}
<h2 id="fm" style="margin-top:0">${fmsg(pc)}</h2><p id="fe">مرّت ${Math.floor(F.el/60)} دقيقة · ${Math.round(pc*100)}% من رحلتك</p><br>
<div class="row" style="justify-content:center"><button class="btn" onclick="pauseF()">${F.run?'إيقاف مؤقت':'متابعة'}</button></div>
<div style="margin-top:14px">${SO.map(([k,l])=>`<span class="chip ${F.snd==k?'on':''}" onclick="chS('${k}')">${l}</span>`).join('')}</div></div>`}
const hero=(n,t,d)=>`<div class="hero2"><div class="hn">${n}</div><div><h3>${t}</h3><p>${d}</p></div></div>`;
function secOf(){return S.step=='main'?['g','b','g','p','n'][S.tab]:S.step=='fs'?'l':S.step=='ob'?['g','b','p','l'][S.ob]:'g'}
function applyT(){const h=document.documentElement;h.dataset.theme=S.dark?'dark':'light';const sy=Math.min(2,(parseFloat(getComputedStyle(h).fontSize)||16)/16);h.style.setProperty('--ts',Math.max(S.ts||1,(S.a11y&&S.a11y.lt)?1.3:1)*sy);['hc','lt','rm','si','lb','fx','sr','cm'].forEach(k=>h.classList.toggle('a-'+k,!!(S.a11y&&S.a11y[k])))}
const V=[home,discover,activities,challenges,profile];
function render(){applyT();document.body.dataset.main=S.step=='main'?'1':'';document.body.dataset.sec=secOf();const v=$('#view'),n=$('#navwrap');
 if(S.step=='main'){v.innerHTML=V[S.tab]();const ex=n.querySelector('nav');
  if(ex){ex.style.setProperty('--i',S.tab);ex.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('on',i==S.tab);b.setAttribute('aria-current',i==S.tab)});return}
  n.innerHTML=`<nav aria-label="التنقل" style="--i:${S.tab}"><div class="bub"></div>${TABS.map((t,i)=>`<button class="${i==S.tab?'on':''}" aria-label="${t}" aria-current="${i==S.tab}" onclick="S.tab=${i};render()"><svg viewBox="0 0 24 24">${ICO[i]}</svg>${t}</button>`).join('')}</nav>`}
 else{n.innerHTML='';v.innerHTML={splash,ob,auth,otp,int,ds,fs:fview}[S.step]()}
 const s=v.querySelector('.scr');}
const _r=render;render=function(){_r();enh()};render();
</script>
